name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  sdk:
    strategy:
      fail-fast: false
      matrix:
        pi: ["1.0.1"] # single current baseline; older versions are not supported
    env:
      PI_TEST_VERSION: ${{ matrix.pi }}
      PI_OFFLINE: "1"
      PI_TELEMETRY: "0"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --input-type=module -e 'import {VERSION} from "@earendil-works/pi-coding-agent"; if(VERSION !== process.env.PI_TEST_VERSION) process.exit(1)'
      - run: npm run check
      - run: npm run format:check
      - run: npm pack --json
      - run: npm run smoke
        env:
          PI_OFFLINE: "1"
          PI_TELEMETRY: "0"
  verify:
    needs: sdk
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.sdk.result }}" = "success"
